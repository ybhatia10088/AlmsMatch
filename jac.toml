[project]
name = "almsmatch"
version = "0.1.0"
description = "Agentic nonprofit matching engine for individual donors, built in Jac."
entry-point = "main.jac"

[run]
diagnostics = "error"

# `jac run` persists the graph under .jac/. Changing a node or edge archetype after
# that invalidates the stored anchors and the next run dies with
# "NodeAnchor ... is not a valid reference!". Any archetype edit = run `jac script reset`.
# Never debug a stale-graph error live.
#
# --data --cache (not --all): --all also wipes .jac/packages, which would uninstall
# byllm and the other plugins. Data + cache is the exact blast radius we want.
[scripts]
reset = "jac clean --data --cache --force && jac run main.jac"
demo = "jac run main.jac"
# Tests attach fixture Investors/Nonprofits to the same persisted root the demo
# uses, so this cleans on both sides - never hand the demo a graph full of TEST_*.
test = "jac clean --data --cache --force && jac test walkers.jac -v && jac clean --data --cache --force"
# Pinned port, not jac start's default fallback-to-next-free-port behavior -
# that's what made the Phase 4 API_BASE port a moving target. web/index.html's
# API_BASE is hardcoded to match this exact port; change both together.
serve = "jac start api.jac --no_client --port 8123"

# Anthropic model names are BARE (no "anthropic/" prefix) - verified against
# jac-by-llm.md and confirmed on the wire: litellm resolves any claude-* name it
# knows to provider=anthropic on its own. Prefixing works too but is unnecessary.
#
# The bare form only routes for names in litellm's model map - an unknown bare name
# dies with "LLM Provider NOT provided", NOT with a model-not-found. If a name ever
# has to be one litellm doesn't know, prefix it "anthropic/..." and it always routes.
#
# ${VAR:-default} interpolation is a documented jac.toml feature, so LLM_MODEL=... in
# the environment swaps the model with no file edit - that's the escape hatch if the
# demo runs long and we need to drop to claude-haiku-4-5.
# The key itself never lands here: ANTHROPIC_API_KEY stays in the gitignored .env.
[plugins.byllm.model]
default_model = "${LLM_MODEL:-claude-sonnet-5}"
